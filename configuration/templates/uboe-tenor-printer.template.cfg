#############################################################################################################
### CONFIGURATION GENERATED BY THE RATOS CONFIGURATOR
### Everything below [include RatOS.cfg] will override default RatOS behavior
#############################################################################################################
[include RatOS.cfg]

#############################################################################################################
### MACRO CONFIGURATION
### Configure the behavior of RatOS macros
### See: https://os.ratrig.com/docs/configuration/macros
#############################################################################################################
[gcode_macro RatOS]
variable_relative_extrusion: True
variable_preheat_extruder: True
variable_calibrate_bed_mesh: True
variable_nozzle_priming: "primeblob"
variable_start_print_park_in: "back"
variable_start_print_park_z_height: 50
variable_end_print_park_in: "back"
variable_pause_print_park_in: "back"

#############################################################################################################
### USER OVERRIDES & CUSTOM CONFIGURATION
### Anything custom you want to add, or RatOS configuration you want to override, do it here.
### This section is pre-populated with the most common settings you may want to change.
### See: https://os.ratrig.com/docs/configuration/includes-and-overrides
###
### It is recommended that you follow these steps to properly calibrate your printer:
### 0) Sanity check and PID Tuning: https://www.klipper3d.org/Config_checks.html
### 1) Z-offset calibration: https://www.klipper3d.org/Probe_Calibrate.html#calibrating-probe-z-offset
### 2) Pressure Advance: https://www.klipper3d.org/Pressure_Advance.html
### 3) Skew Correction: https://www.klipper3d.org/Skew_Correction.html
### 4) Resonance Compensation: https://www.klipper3d.org/Resonance_Compensation.html
### RatOS has dedicated macro's to generate shaper graphs for deeper analysis (requires accelerometer).
### Use MEASURE_COREXY_BELT_TENSION to compare tension between belts, and use
### GENERATE_SHAPER_GRAPHS to generate the resonance graphs for analysing and manually entering input shaper
### configuration.
### You can run SHAPER_CALIBRATE to automatically calibrate your input shaper configuration, if you just want
### to get started.
### Additionally, you can use the Realtime Analysis Tool to analyze your printer's performance in real-time.
### Read more about klipper here: https://www.klipper3d.org/Overview.html
#############################################################################################################

#---------------------------------------------------- X -----------------------------------------------------
# The X axis motor for the left toolhead, located at the rear left of the printer
#------------------------------------------------------------------------------------------------------------
[stepper_x]
dir_pin: !x_dir_pin                # Add ! in front of pin name to reverse the direction of stepper_x
rotation_distance: 32             # 40 for 20 tooth 2GT pulleys, 32 for 16 tooth 2GT pulleys
position_min: -72
position_max: 592
position_endstop: -72

#---------------------------------------------- DUAL_CARRIAGE -----------------------------------------------
# The X axis motor for the right toolhead, located at the rear right of the printer
#------------------------------------------------------------------------------------------------------------
[dual_carriage]
dir_pin: !dual_carriage_dir_pin    # Add ! in front of pin name to reverse the direction of dual_carriage
rotation_distance: 32             # 40 for 20 tooth 2GT pulleys, 32 for 16 tooth 2GT pulleys
position_min: 8
position_max: 672
position_endstop: 672
safe_distance: 80

#---------------------------------------------------- Y -----------------------------------------------------
# The left Y motor used for cartesian Y control in Hybrid CoreXY, located at the rear left of the printer
#------------------------------------------------------------------------------------------------------------
[stepper_y]
dir_pin: !y_dir_pin               # Remove ! in front of pin name to reverse the direction of stepper_y
rotation_distance: 40             # 40 for 20 tooth 2GT pulleys, 32 for 16 tooth 2GT pulleys
position_min: 0
position_max: 637
position_endstop: 637

#---------------------------------------------------- Y1 ----------------------------------------------------
# The right Y motor used for cartesian Y control in Hybrid CoreXY, located at the rear right of the printer
#------------------------------------------------------------------------------------------------------------
[stepper_y1]
dir_pin: y1_dir_pin               # Add ! in front of pin name to reverse the direction of stepper_y1
rotation_distance: 40             # 40 for 20 tooth 2GT pulleys, 32 for 16 tooth 2GT pulleys

#---------------------------------------------------- Z -----------------------------------------------------
# The left Z motor for the kinematic bed
#------------------------------------------------------------------------------------------------------------
[stepper_z]
dir_pin: z0_dir_pin              # Remove ! in front of pin name to reverse the direction of stepper_z
rotation_distance: 4              # 4 for TR8*4 lead screws
position_min: -7
position_max: 200

#---------------------------------------------------- Z1 ----------------------------------------------------
# The rear left Z motor for the kinematic bed
#------------------------------------------------------------------------------------------------------------
[stepper_z1]
dir_pin: z1_dir_pin              # Remove ! in front of pin name to reverse the direction of stepper_z1
rotation_distance: 4              # 4 for TR8*4 lead screws

#---------------------------------------------------- Z2 ----------------------------------------------------
# The rear right Z motor for the kinematic bed
#------------------------------------------------------------------------------------------------------------
[stepper_z2]
dir_pin: z2_dir_pin              # Remove ! in front of pin name to reverse the direction of stepper_z2
rotation_distance: 4              # 4 for TR8*4 lead screws

#---------------------------------------------------- Z3 ----------------------------------------------------
# The right Z motor for the kinematic bed
#------------------------------------------------------------------------------------------------------------
[stepper_z3]
dir_pin: z3_dir_pin              # Remove ! in front of pin name to reverse the direction of stepper_z3
rotation_distance: 4              # 4 for TR8*4 lead screws

#------------------------------------------------- EXTRUDER -------------------------------------------------
# The extruder motor used for pushing filament through the left toolhead (T0)
#------------------------------------------------------------------------------------------------------------
[extruder]
dir_pin: toolboard_t0:e_dir_pin   # Add ! in front of pin name to reverse the direction of extruder
rotation_distance: 47.088         # Galileo 2 default
#pressure_advance: 0.05           # Check https://www.klipper3d.org/Pressure_Advance.html for pressure advance tuning.
control: pid
pid_Kp=31.583
pid_Ki=3.452
pid_Kd=72.248

#------------------------------------------------ EXTRUDER1 -------------------------------------------------
# The extruder motor used for pushing filament through the right toolhead (T1)
#------------------------------------------------------------------------------------------------------------
[extruder1]
dir_pin: toolboard_t1:e_dir_pin   # Add ! in front of pin name to reverse the direction of extruder1
rotation_distance: 47.088         # Galileo 2 default
#pressure_advance: 0.05           # Check https://www.klipper3d.org/Pressure_Advance.html for pressure advance tuning.
control: pid
pid_Kp=31.583
pid_Ki=3.452
pid_Kd=72.248

#----------------------------------------------- HEATER BED -------------------------------------------------
# The heater bed configuration for the left pad
#------------------------------------------------------------------------------------------------------------
[quad_pad_bed_heater]
[heater_bed]
heater_pin:birdsnest:bed_heater_pin
sensor_pin:birdsnest:bed_sensor_pin
sensor_type:Generic 3950
control: pid
pid_Kp=59.586
pid_Ki=3.310
pid_Kd=268.162
min_temp: 10
max_temp: 130
pullup_resistor: 4700

#---------------------------------------------- HEATER BED 1 ------------------------------------------------
# The heater bed configuration for the rear left pad
#------------------------------------------------------------------------------------------------------------
[heater_generic heater_bed1]
gcode_id: 1
heater_pin:birdsnest:bed1_heater_pin
sensor_pin:birdsnest:bed1_sensor_pin
sensor_type:Generic 3950
control: pid
pid_Kp=59.586
pid_Ki=3.310
pid_Kd=268.162
min_temp: 10
max_temp: 130
pullup_resistor: 4700

#---------------------------------------------- HEATER BED 2 ------------------------------------------------
# The heater bed configuration for the rear right pad
#------------------------------------------------------------------------------------------------------------
[heater_generic heater_bed2]
gcode_id: 2
heater_pin:birdsnest:bed2_heater_pin
sensor_pin:birdsnest:bed2_sensor_pin
sensor_type:Generic 3950
control: pid
pid_Kp=59.586
pid_Ki=3.310
pid_Kd=268.162
min_temp: 10
max_temp: 130
pullup_resistor: 4700

#---------------------------------------------- HEATER BED 3 ------------------------------------------------
# The heater bed configuration for the right pad
#------------------------------------------------------------------------------------------------------------
[heater_generic heater_bed3]
gcode_id: 3
heater_pin:birdsnest:bed3_heater_pin
sensor_pin:birdsnest:bed3_sensor_pin
sensor_type:Generic 3950
control: pid
pid_Kp=59.586
pid_Ki=3.310
pid_Kd=268.162
min_temp: 10
max_temp: 130
pullup_resistor: 4700

# Probe configuration
[probe]
#--------------------------------------------------------------------
# with TAP, the nozzle IS the probe
pin: ^toolboard_t0:probe_pin # In IN.0 position
x_offset: 0
y_offset: 0
# z_offset: -0.231
# z_offset: -0.600
z_offset: -1.450
speed: 10.0
samples: 3
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.01
samples_tolerance_retries: 5

[uboe_tenor]
z_safeguard_speed: 25
z_safeguard_endstop_pins: mcu:PC5, mcu:PB0, mcu:PC4, mcu:PA7
z_safeguard_position: 200

[input_shaper]
shaper_type_x : mzv
shaper_freq_x : 32.6
shaper_type_y : mzv
shaper_freq_y : 28.6

[gcode_shell_command generate_shaper_graphs]
command: /home/uboe/printer_data/config/RatOS/scripts/idex-generate-shaper-graph.sh
timeout: 120.
verbose: True

[gcode_shell_command generate_tension_graphs]
command: /home/uboe/printer_data/config/RatOS/scripts/idex-generate-belt-tension-graph.sh
timeout: 120.
verbose: True

[gcode_shell_command generate_shaper_graph_x]
command: /home/uboe/printer_data/config/RatOS/scripts/generate-shaper-graph-x.sh
timeout: 60.
verbose: True


[gcode_shell_command generate_shaper_graph_y]
command: /home/uboe/printer_data/config/RatOS/scripts/generate-shaper-graph-y.sh
timeout: 60.
verbose: True

[servo obturator]
pin: mcu:PF12
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025
initial_angle: 0

