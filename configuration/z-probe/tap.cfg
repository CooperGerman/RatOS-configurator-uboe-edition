# Configurator Metadata
# {
#   "type": "static-probe",
#   "title": "Voron TAP"
# }

# Probe configuration
[probe]
#--------------------------------------------------------------------
# with TAP, the nozzle IS the probe
pin: ^probe_pin
x_offset: 0
y_offset: 0
# IMPORTANT : Adjust the z_offset when calibrating the Z probe.
z_offset: -1.450
speed: 5.0
# lift_speed : 25
samples: 3
samples_result: average
sample_retract_dist: 4.0
samples_tolerance: 0.02
samples_tolerance_retries: 5

[gcode_macro RatOS]
variable_z_probe: "static"