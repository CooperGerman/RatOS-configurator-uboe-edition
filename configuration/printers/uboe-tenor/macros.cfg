# WARNING. DO NOT EDIT THIS FILE.
# To override settings from this file, you can copy and paste the relevant
# sections into your printer.cfg and change it there.

#####
# INCLUDE IDEX MACRO FILES
#####
[include ../../macros/idex/*.cfg]

[gcode_macro _VAOC]
variable_is_fixed: True                    # true  = VAOC camera is fixed on the printer
variable_safe_z: 5                        # safe z height for VAOC start and end horizontal moves

[delayed_gcode _IDEX_INIT]
initial_duration: 0.1
gcode:
	# ensure inverted hybrid corexy configuration
	VERIFY_HYBRID_INVERTED
