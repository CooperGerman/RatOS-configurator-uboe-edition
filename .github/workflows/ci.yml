name: "CI"
env:
  RATOS_CONFIGURATION_PATH: ${{ github.workspace }}/ratos-configurator/configuration
  KLIPPER_CONFIG_PATH: ${{ github.workspace }}/config
  RATOS_SCRIPT_DIR: ${{ github.workspace }}/ratos-configurator/src/scripts
  KLIPPER_DIR: ${{ github.workspace }}/klipper
  KLIPPER_ENV: ${{ github.workspace }}/klippy-env
  MOONRAKER_DIR: ${{ github.workspace }}/moonraker
  LOG_FILE: ${{ github.workspace }}/ratos-configurator.log
  RATOS_DATA_DIR: ${{ github.workspace }}/ratos-data
on:
  push:
    branches:
      - "development"
      - "v2.1.x"
      - "monorepo"
      - "**/devpub/**"
  pull_request:
    branches:
      - "**"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checkout_dependencies:
    name: Lint, Typecheck and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: "ratos-configurator"
          fetch-tags: true

      - name: Write environment variables to .env.local
        run: |
          echo "RATOS_CONFIGURATION_PATH=${{ env.RATOS_CONFIGURATION_PATH }}" > ratos-configurator/src/.env.local
          echo "KLIPPER_CONFIG_PATH=${{ env.KLIPPER_CONFIG_PATH }}" >> ratos-configurator/src/.env.local
          echo "RATOS_SCRIPT_DIR=${{ env.RATOS_SCRIPT_DIR }}" >> ratos-configurator/src/.env.local
          echo "KLIPPER_DIR=${{ env.KLIPPER_DIR }}" >> ratos-configurator/src/.env.local
          echo "KLIPPER_ENV=${{ env.KLIPPER_ENV }}" >> ratos-configurator/src/.env.local
          echo "MOONRAKER_DIR=${{ env.MOONRAKER_DIR }}" >> ratos-configurator/src/.env.local
          echo "LOG_FILE=${{ env.LOG_FILE }}" >> ratos-configurator/src/.env.local
          echo "RATOS_DATA_DIR=${{ env.RATOS_DATA_DIR }}" >> ratos-configurator/src/.env.local

      - name: Extract target branch name
        shell: bash
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Install Node
        uses: actions/setup-node@v4.0.1
        with:
          # Version Spec of the version to use. Examples: 12.x, 10.15.1, >=10.15.0.
          node-version: 20.x # Tests currently require node 20

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        id: pnpm-install
        with:
          run_install: false
          version: 9.1

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Dependencies
        working-directory: ratos-configurator/src
        run: pnpm install --frozen-lockfile

      - name: Checkout Klipper
        uses: actions/checkout@v4
        with:
          repository: klipper3d/klipper
          path: "klipper"

      - name: Checkout Moonraker
        uses: actions/checkout@v4
        with:
          repository: Arksine/moonraker
          path: "moonraker"

      - name: Bash Syntax Check
        working-directory: ratos-configurator
        run: |
          echo "🔍 Finding bash scripts in the repository..."

          # Find all .sh files and files with bash shebangs
          bash_files=()

          # Add all .sh files
          while IFS= read -r -d '' file; do
            bash_files+=("$file")
          done < <(find . -name "*.sh" -type f -not -path "*/node_modules/*" -not -path "./.git/*" -not -path "./.augment/*" -print0)

          # Add files with bash shebangs (excluding .sh files already found)
          while IFS= read -r -d '' file; do
            # Skip if it's already a .sh file
            if [[ "$file" != *.sh ]]; then
              bash_files+=("$file")
            fi
          done < <(find . -path "*/node_modules/*" -prune -o -type f -not -path "./.git/*" -not -path "./.augment/*" -exec grep -q "^#!/bin/bash\|^#!/usr/bin/env bash" {} \; -print0 2>/dev/null)

          if [ ${#bash_files[@]} -eq 0 ]; then
            echo "ℹ️  No bash scripts found in the repository - skipping bash syntax validation"
            echo "This is normal for branches/forks that don't contain shell scripts."
            exit 0
          fi

          echo "📋 Found ${#bash_files[@]} bash script(s) to validate:"
          printf '  - %s\n' "${bash_files[@]}"
          echo

          # Create a temporary file to store validation results
          validation_results=$(mktemp)
          validation_errors=$(mktemp)

          # Function to validate a single script (will be used by xargs)
          validate_script() {
            local script="$1"
            local results_file="$2"
            local errors_file="$3"

            echo "🔍 Checking syntax of: $script"
            if bash -n "$script" 2>/dev/null; then
              echo "✅ $script - syntax OK"
              echo "$script:OK" >> "$results_file"
            else
              echo "❌ $script - syntax ERROR:"
              bash -n "$script" 2>&1 | sed 's/^/    /'
              echo "$script:ERROR" >> "$results_file"
              echo "$script" >> "$errors_file"
            fi
            echo
          }

          # Export the function so xargs can use it
          export -f validate_script

          # Determine optimal parallelism (use number of CPU cores, max 8 to avoid overwhelming GitHub Actions)
          max_parallel=$(nproc)
          if [ "$max_parallel" -gt 8 ]; then
            max_parallel=8
          fi

          echo "🚀 Running validation in parallel (max $max_parallel processes)..."
          echo

          # Run validation in parallel using xargs
          printf '%s\n' "${bash_files[@]}" | xargs -I {} -P "$max_parallel" bash -c 'validate_script "$@"' _ {} "$validation_results" "$validation_errors"

          # Read results and count failures
          failed_count=0
          if [ -f "$validation_errors" ]; then
            failed_count=$(wc -l < "$validation_errors" 2>/dev/null || echo 0)
          fi

          # Report results
          if [ "$failed_count" -eq 0 ]; then
            echo "🎉 All bash scripts passed syntax validation!"
          else
            echo "💥 $failed_count script(s) failed syntax validation:"
            if [ -f "$validation_errors" ]; then
              while IFS= read -r failed_script; do
                echo "  - $failed_script"
              done < "$validation_errors"
            fi
            echo
            echo "Please fix the syntax errors in the above scripts before merging."

            # Cleanup temporary files
            rm -f "$validation_results" "$validation_errors"
            exit 1
          fi

          # Cleanup temporary files
          rm -f "$validation_results" "$validation_errors"

      - name: Lint
        working-directory: ratos-configurator/src
        run: pnpm run lint:ci

      - name: Typecheck
        uses: fersilva16/ts-report-action@1.1.0
        if: success() || failure() # run this step even if previous step failed
        with:
          project: ratos-configurator/src/tsconfig.json

      - name: Run test suite
        working-directory: ratos-configurator/src
        if: success() || failure() # run this step even if previous step failed
        run: pnpm run test:ci --outputFile=./report.xml

      - name: Upload reports
        uses: actions/upload-artifact@v4 # upload test results
        if: success() || failure() # run this step even if previous step failed
        with:
          name: test-results
          path: |
            ratos-configurator/src/report.xml
            ratos-configurator/src/eslint_report.json

      - name: Report status
        if: ${{ failure() }}
        run: exit 1
